services:
  - type: web
    name: fall-detection-api-2
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
